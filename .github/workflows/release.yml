name: Windows Release

# Build the Windows .exe + installer. Pushing a tag like v0.5.0 also publishes
# a GitHub Release with the installer attached. Manual runs build artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual build (e.g. 0.5.0). Defaults to moreader.__version__."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(python -c 'import moreader; print(moreader.__version__)')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Build exe (PyInstaller)
        shell: cmd
        run: pyinstaller --noconfirm --clean --onefile --windowed --name moreader --icon moreader/assets/icon.ico --add-data "moreader/assets;moreader/assets" --collect-all PySide6 run_moreader.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\moreader.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moreader-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/moreader.exe
            dist/moreader-setup-*.exe

      - name: Publish GitHub Release
        # Publish on a tag push, or on a manual run (which creates the tag
        # itself so a release can be cut from the Actions UI without pushing one).
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: moreader ${{ steps.ver.outputs.version }}
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/moreader-setup-*.exe
            dist/moreader.exe
