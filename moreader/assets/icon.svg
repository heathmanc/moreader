<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16212e"/><stop offset="1" stop-color="#0b121b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d3df"/>
    </linearGradient>
    <linearGradient id="mo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5e2ef"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33d67a"/><stop offset="1" stop-color="#1ea85a"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#2d8cf0" stroke-width="10" stroke-opacity="0.9"/>
  <!-- the letters MO: the hero of the mark -->
  <text x="256" y="270" text-anchor="middle" fill="url(#mo)"
        font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold"
        font-size="230" letter-spacing="-6">MO</text>
  <!-- barcode strip beneath, with a blue scan line -->
  <g>
    <rect x="104" y="320" width="7" height="84" rx="2" fill="url(#bar)"/>
<rect x="120" y="320" width="11" height="84" rx="2" fill="url(#bar)"/>
<rect x="138" y="320" width="15" height="84" rx="2" fill="url(#bar)"/>
<rect x="162" y="320" width="9" height="84" rx="2" fill="url(#bar)"/>
<rect x="182" y="320" width="7" height="84" rx="2" fill="url(#bar)"/>
<rect x="196" y="320" width="11" height="84" rx="2" fill="url(#bar)"/>
<rect x="214" y="320" width="15" height="84" rx="2" fill="url(#bar)"/>
<rect x="240" y="320" width="9" height="84" rx="2" fill="url(#bar)"/>
<rect x="256" y="320" width="7" height="84" rx="2" fill="url(#bar)"/>
<rect x="272" y="320" width="11" height="84" rx="2" fill="url(#bar)"/>
<rect x="294" y="320" width="15" height="84" rx="2" fill="url(#bar)"/>
<rect x="316" y="320" width="9" height="84" rx="2" fill="url(#bar)"/>
<rect x="336" y="320" width="7" height="84" rx="2" fill="url(#bar)"/>
<rect x="350" y="320" width="11" height="84" rx="2" fill="url(#bar)"/>
<rect x="368" y="320" width="15" height="84" rx="2" fill="url(#bar)"/>
<rect x="390" y="320" width="9" height="84" rx="2" fill="url(#bar)"/>
  </g>
  <rect x="90" y="357" width="332" height="9" rx="4" fill="#2d8cf0" fill-opacity="0.9"/>
  <!-- verified badge, lower-right, with a dark halo to lift it off the barcode -->
  <circle cx="392" cy="392" r="92" fill="#0b121b"/>
  <circle cx="392" cy="392" r="78" fill="url(#badge)"/>
  <path d="M354 394 l26 26 l50 -58" fill="none" stroke="#ffffff" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>