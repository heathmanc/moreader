# moreader configuration.
# This file is normally edited from the GUI's password-protected Configuration
# screen, but you can also edit it by hand.  Copy it to config.yaml to start.

security:
  # Password required to open the Configuration screen in the GUI.
  password: "2134chAP!@"

plc:
  # driver: "logix" (pylogix -> CompactLogix/ControlLogix)
  #         "simulated" (no hardware -- for testing/demo)
  driver: logix
  ip_address: 192.168.1.10
  slot: 0                       # ControlLogix CPU slot; 0 for CompactLogix

  # Each tag has a name (the PLC address) and a description shown in the GUI.
  tags:
    expected_model:
      name: Program:MainProgram.ModelNumber
      description: Model/part number the PLC is currently set to run (STRING)
    run_permit:
      name: Program:MainProgram.ScanRunPermit
      description: BOOL the program SETS to allow the PLC to run the product
    alarm:
      name: Program:MainProgram.ScanMismatchAlarm
      description: BOOL the program SETS when a scan does not match (HMI alarm)
    shift_request:
      name: Program:MainProgram.ShiftChangeRequest
      description: Optional BOOL the PLC/HMI raises to force a re-scan
    last_scan:
      name: Program:MainProgram.LastScan
      description: Optional STRING the program writes the last scanned value to

scanner:
  # type: "keyboard" (HID keyboard-wedge -- types into the GUI scan box),
  #       "serial"   (USB virtual COM port; headless mode only, needs pyserial),
  #       "stdin"    (piped input -- for testing)
  type: keyboard
  port: /dev/ttyACM0           # serial only (e.g. COM3 on Windows)
  baudrate: 9600               # serial only
  # Optional regex with a named group "model" to pull the model out of a richer
  # MO barcode, e.g. "MO12345|MODEL=ABC-100|QTY=500":
  # scan_pattern: 'MODEL=(?P<model>[^|]+)'
  scan_pattern: null

compare:
  strip: true                  # trim surrounding whitespace
  ignore_case: true            # case-insensitive match
  collapse_internal_space: false

shift:
  start_times:                 # local HH:MM; empty list disables time-based detection
    - "06:00"
    - "14:00"
    - "22:00"
  watch_plc_request: true      # also lock out on the PLC shift_request bit edge
  lock_on_startup: true        # require a scan before the first run after start
  poll_interval: 2.0           # seconds between shift-change checks while running
