# moreader configuration.
# Normally edited from the GUI's password-protected Configuration screen, but you
# can also edit it by hand.  Copy it to config.yaml to start.

security:
  # Password required to open the Configuration screen in the GUI.
  password: "2134chAP!@"

plc:
  # driver: "logix" (pylogix -> CompactLogix/ControlLogix) or "simulated" (no hardware)
  driver: logix
  heartbeat_interval: 1.0       # seconds between heartbeat writes to the master

  # Three read-only encapsulator PLCs. moreader reads only the recipe DINT.
  encapsulators:
    - name: Encapsulator 1
      ip_address: 192.168.1.11
      slot: 0
      tags:
        recipe_tag:
          name: recipe[0].Name
          description: DINT recipe number this encapsulator is set to run
    - name: Encapsulator 2
      ip_address: 192.168.1.12
      slot: 0
      tags:
        recipe_tag: {name: recipe[0].Name, description: DINT recipe number this encapsulator is set to run}
    - name: Encapsulator 3
      ip_address: 192.168.1.13
      slot: 0
      tags:
        recipe_tag: {name: recipe[0].Name, description: DINT recipe number this encapsulator is set to run}

  # The master PLC (COS). moreader SETS MO_Verified true when the scan matches
  # every encapsulator, clears it on shift change / manual lockout, and writes
  # the heartbeat DINT on the interval above.
  master:
    name: COS
    ip_address: 192.168.1.10
    slot: 0
    tags:
      mo_verified_tag:
        name: MO_Verified
        description: BOOL the program SETS true when the scan is verified (allows COS to run)
      mo_bypassed_tag:
        name: MO_Bypassed
        description: BOOL the program SETS true when an operator bypasses verification (passworded; cleared at shift/lockout)
      cycle_stop_tag:
        name: System.Mode.CycleStopReq
        description: BOOL the program SETS true on a lockout/shift change to request a graceful cycle stop
      heartbeat_tag:
        name: Heartbeat
        description: DINT the program increments so the master PLC knows the app is alive

scanner:
  # type: "keyboard" (HID keyboard-wedge -> types into the scan popup),
  #       "serial"   (virtual COM port, e.g. a Zebra scanner in USB-CDC mode),
  #       "stdin"    (piped input -- for testing/headless)
  type: keyboard
  port: COM4                    # serial only: COM4 (Windows) or /dev/ttyACM0 (Linux)
  baudrate: 9600                # serial only
  # Optional regex with a named group "model" to pull the number out of a richer
  # MO barcode before the last-N-digits rule, e.g. 'MO(?P<model>\d+)'.
  scan_pattern: null

compare:
  mo_last_digits: 4             # compare only the last 4 digits of the scan (0 = whole number)
  digits_only: true            # strip non-digit characters before taking the last N
  mo_length: 9                  # required exact character count of the MO scan (0 = no check)

secondary:                      # optional Assembled Battery cross-check (3-step scan)
  enabled: false
  stuffed_element_label: Stuffed Element MO    # step 1 — last digits matched to the encapsulators
  assembled_mo_label: Assembled Battery MO     # step 2 — a DIFFERENT MO
  battery_label: Battery Label                 # step 3
  assembled_mo_last_digits: 4   # last N digits of the Assembled Battery MO
  assembled_mo_length: 9        # required exact length of the Assembled Battery MO scan (0 = no check)
  battery_first_digits: 4       # first N digits of the battery label, compared to the Assembled MO last N
  battery_min_length: 10        # min characters of the battery scan (keeps it distinct from the MO)

shift:
  start_times:                 # local HH:MM; empty list disables time-based detection
    - "06:00"
    - "14:00"
    - "22:00"
  lock_on_startup: true        # require a scan before the first run after start
  poll_interval: 2.0           # seconds between shift-change checks while running

audit:
  enabled: true                # write a daily CSV of every scan/gate change
  directory: logs              # folder for moreader-YYYY-MM-DD.csv files
